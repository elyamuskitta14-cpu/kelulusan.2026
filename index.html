    // Target: 20 Mei 2026 pukul 20:00 WIT (UTC+9) = 11:00 UTC
    const releaseDate = new Date('2026-05-20T11:00:00Z');

    function showCekKelulusan() {
      document.getElementById('page-sambutan').classList.add('hidden');
      document.getElementById('page-cek').classList.remove('hidden');
      document.getElementById('result').innerHTML = '';
      document.getElementById('input-nisn').value = '';
    }

    function showSambutan() {
      document.getElementById('page-cek').classList.add('hidden');
      document.getElementById('page-sambutan').classList.remove('hidden');
    }

    function createConfetti() {
      const colors = ['#fbbf24','#34d399','#60a5fa','#f472b6','#a78bfa','#ffffff'];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + '%';
        el.style.width = (Math.random() * 10 + 6) + 'px';
        el.style.height = (Math.random() * 10 + 6) + 'px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = (Math.random() * 2 + 2) + 's';
        el.style.animationDelay = (Math.random() * 1) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }
    }

    function cekKelulusan(e) {
      e.preventDefault();
      const val = document.getElementById('input-nisn').value.trim();
      const res = document.getElementById('result');

      if (!val) { res.innerHTML = '<p class="text-blue-200 text-center text-sm font-semibold">Silakan masukkan NISN terlebih dahulu.</p>'; return; }

      // Admin bypass
      if (val.toLowerCase() === 'admin') {
        let html = '<div class="mt-4 max-h-96 overflow-auto rounded-2xl bg-gradient-to-br from-blue-500/10 to-cyan-500/10 border-2 border-blue-300/40 p-4"><h3 class="text-white font-bold mb-4 text-center sticky top-0 bg-gradient-to-r from-blue-500 to-cyan-600 -mx-4 -mt-4 px-4 py-3 rounded-t-2xl" style="text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);">Daftar Lengkap Siswa Lulus (6A & 6B & 6C)</h3><table class="w-full text-xs text-white"><thead><tr class="bg-blue-500/30 sticky top-12"><th class="p-2 text-left">No</th><th class="p-2 text-left">Nama</th><th class="p-2">Kelas</th><th class="p-2">Status</th></tr></thead><tbody>';
        students.forEach((s, i) => {
          const rowColor = i % 2 === 0 ? 'bg-blue-500/10' : 'bg-blue-500/20';
          html += `<tr class="${rowColor} border-t border-blue-400/20"><td class="p-2 font-semibold">${i+1}</td><td class="p-2 text-blue-100">${s.nama}</td><td class="p-2 text-center text-cyan-300">${s.kelas}</td><td class="p-2 text-center"><span class="px-2 py-0.5 rounded-lg bg-cyan-500/30 text-cyan-200 font-bold text-xs">✓ ${s.status}</span></td></tr>`;
        });
        html += '</tbody></table></div>';
        res.innerHTML = html;
        return;
      }

      // Time check
      if (new Date() < releaseDate) {
        res.innerHTML = '<div class="bg-gradient-to-r from-blue-500/20 to-cyan-500/20 border-2 border-blue-400/40 rounded-2xl p-6 text-center animate-slide-in"><div class="flex justify-center mb-3"><div class="w-14 h-14 rounded-full bg-blue-500/20 border border-blue-400/40 flex items-center justify-center"><i data-lucide="clock" style="width:28px;height:28px;" class="text-blue-300"></i></div></div><p class="text-blue-100 font-bold text-lg">⏳ Pengumuman Belum Dimulai</p><p class="text-blue-50/80 text-sm mt-2">Pengumuman kelulusan akan dibuka pada:</p><p class="text-white font-bold text-base mt-2">20 Mei 2026, Pukul 20.00 WIT</p><p class="text-blue-50/60 text-xs mt-3">Silakan kembali pada waktu yang ditentukan</p></div>';
        return;
      }
